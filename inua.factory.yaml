# =============================================================================
#  INUA de fábrica: lo que lleva grabado la unidad que se vende.
#  Es inua.yaml más lo que pide el programa Made for ESPHome:
#    - carga de Wi-Fi por Bluetooth (Improv), además del punto de acceso propio
#    - datos del proyecto y adopción desde ESPHome Device Builder
#    - actualizaciones publicadas por el fabricante (GitHub Pages del repositorio)
#  Las versiones las arma GitHub Actions (.github/workflows en el repositorio): cada push a main
#  deja un borrador de versión, y el flujo "Release" lo publica a mano.
# =============================================================================

substitutions:
  name: inua
  friendly_name: Inua

packages:
  inua: !include inua.yaml

esphome:
  name_add_mac_suffix: true          # un mismo binario sirve para todas las unidades
  project:
    name: heluxlabs.inua
    version: dev                     # GitHub Actions lo reemplaza por la versión de cada release

# El usuario adopta el cubo y pasa a compilar esta configuración pública por su cuenta.
dashboard_import:
  package_import_url: github://HeluxLab/inua/inua.yaml@main

# Carga de Wi-Fi por Bluetooth (Improv). Hasta ESPHome 2026.9 se llamaba esp32_improv.
improv_ble:
  id: wifi_improv
  authorizer: none

http_request:
  id: http_client

ota:
  - platform: http_request
    id: ota_http

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware"
    # Lo publica el flujo "Publish Pages" del repositorio. Si se renombra la organización de GitHub,
    # esta dirección cambia: actualizarla antes de que salga cualquier cubo.
    source: https://heluxlab.github.io/inua/firmware/inua.manifest.json
